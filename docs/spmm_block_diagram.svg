<svg xmlns="http://www.w3.org/2000/svg" width="908" height="640" viewBox="0 0 908 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
    </marker>
    <style>
      .storage { fill: #161616; stroke: #3a3a3a; stroke-width: 1.2; }
      .datapath { fill: #1d4a3a; stroke: #3d8a68; stroke-width: 1.2; }
      .control { fill: #4a3aa0; stroke: #7a6ad0; stroke-width: 1.2; }
      .frame { fill: none; stroke: #333; stroke-width: 1.2; }
      .wire { fill: none; stroke: #9a9a9a; stroke-width: 1.5; marker-end: url(#arrow); }
      .title { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 14px; text-anchor: middle; }
      .label { font-size: 14px; fill: #d0d0d0; }
      .note { font-size: 14px; fill: #bdbdbd; }
    </style>
  </defs>
  <rect width="908" height="640" fill="#141414"/>

  <!-- inputs -->
  <rect class="storage" x="62" y="22" width="175" height="54" rx="8"/>
  <text class="title" x="150" y="55" fill="#e6e6e6">A (CSR)</text>
  <rect class="storage" x="412" y="22" width="200" height="54" rx="8"/>
  <text class="title" x="512" y="55" fill="#e6e6e6">B (dense)</text>

  <!-- top level -->
  <rect class="frame" x="38" y="104" width="712" height="342" rx="10"/>
  <text class="note" x="58" y="430">SpMM top level: per strip, sets pe.base and replays A</text>

  <rect class="control" x="62" y="146" width="175" height="70" rx="8"/>
  <text class="title" x="150" y="176" fill="#ece8ff">CSRWalker</text>
  <text class="sub" x="150" y="200" fill="#cfc8ff">One Word per cycle</text>

  <rect class="storage" x="412" y="146" width="200" height="70" rx="8"/>
  <text class="title" x="512" y="176" fill="#e6e6e6">StripMajorMem</text>
  <text class="sub" x="512" y="200" fill="#bdbdbd">B in lane-wide strips</text>

  <rect class="datapath" x="387" y="300" width="250" height="70" rx="8"/>
  <text class="title" x="512" y="330" fill="#e8f5ee">PE</text>
  <text class="sub" x="512" y="354" fill="#a8dcc4">lanes MACs, acc per lane</text>

  <!-- wires -->
  <path class="wire" d="M150 76 V144"/>
  <path class="wire" d="M512 76 V144"/>
  <path class="wire" d="M512 216 V298"/>
  <text class="label" x="524" y="262">B_mem[base + col]</text>
  <path class="wire" d="M150 216 V335 H385"/>
  <text class="label" x="200" y="325">Word (col, val, last)</text>
  <path class="wire" d="M512 370 V494"/>
  <text class="label" x="524" y="476">row of C on last, cols lo:hi</text>

  <!-- output -->
  <rect class="storage" x="412" y="496" width="200" height="54" rx="8"/>
  <text class="title" x="512" y="529" fill="#e6e6e6">C (dense)</text>

  <!-- legend -->
  <rect class="control" x="62" y="580" width="18" height="18" rx="3"/>
  <text class="label" x="90" y="594">Control</text>
  <rect class="datapath" x="187" y="580" width="18" height="18" rx="3"/>
  <text class="label" x="215" y="594">Datapath</text>
  <rect class="storage" x="312" y="580" width="18" height="18" rx="3"/>
  <text class="label" x="340" y="594">Storage</text>
</svg>
